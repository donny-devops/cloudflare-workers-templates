name: 🐛 Bug Report
description: Report a bug with the Workflows Starter Template
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the template is affected?
      options:
        - Worker / API routes
        - Workflow execution
        - Durable Objects / WebSocket
        - React frontend / UI
        - Build / Vite configuration
        - Deployment (wrangler)
        - Tests (Vitest)
        - Docker
        - CI / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      value: |
        1. Clone the repository
        2. Run `npm install`
        3. Run `...`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Paste relevant error output, wrangler logs, or browser console errors.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS: (e.g., macOS 15, Ubuntu 24.04, Windows 11)
        - Node.js version: (e.g., 20.19.0)
        - Wrangler version: (e.g., 4.127.0)
        - Browser: (if frontend issue)
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am using the latest version of this template
          required: true
